name: 'Code Hygiene Check'
description: 'Fails on debt markers in source, and on undeclared proof circumventions in proof code.'
runs:
  using: 'composite'
  steps:
    - name: Run Hygiene Check
      shell: bash
      run: |
        # Two distinct classes, deliberately scanned differently.
        #
        #   debt markers      TODO / FIXME / XXX / HACK / STUB
        #   circumventions    sorry / believe_me / admit / postulate / assert_total
        #
        # The previous revision ran one case-insensitive, unanchored grep for
        # both over the WHOLE tree. That made it unusable: "admit" matched
        # "admitted", "sorry" matched ordinary English, any document that
        # DISCUSSED a marker failed (including a debt register whose job is to
        # track them), and `believe_me` failed repositories whose sanctioned,
        # separately-counted axioms are their declared trusted base rather than
        # debt. It matched 112 files in one estate repo and 313 in another.
        #
        # Rules now:
        #   - case-sensitive: TODO is a marker, "todo" in prose is not
        #   - whole-word (-w): "admit" no longer matches "admitted"
        #   - source only: documentation and this repo's own allowlist are out of
        #     scope, because naming a marker is not committing one
        #   - circumventions are only meaningful in proof languages
        #   - a repo may allowlist proof modules that hold sanctioned axioms, on
        #     the understanding that a dedicated gate counts them (see below)
        set -uo pipefail
        fail=0

        ALLOW_FILE=".cicd-hygiene-allow"
        allow_args=()
        if [ -f "$ALLOW_FILE" ]; then
          echo "Using allowlist $ALLOW_FILE:"
          while IFS= read -r pat; do
            case "$pat" in ''|\#*) continue ;; esac
            echo "  exclude: $pat"
            allow_args+=(":(exclude)$pat")
          done < "$ALLOW_FILE"
        fi

        # --- Debt markers, source files only ------------------------------
        echo "Scanning source for debt markers (TODO, FIXME, XXX, HACK, STUB)..."
        debt=$(git grep -n -E -w 'TODO|FIXME|XXX|HACK|STUB' -- \
                 ':(exclude)*.md' ':(exclude)*.adoc' ':(exclude)*.txt' \
                 ':(exclude)docs/**' ':(exclude)*.a2ml' \
                 ':(exclude)DEBT.md' ':(exclude)'"$ALLOW_FILE" \
                 "${allow_args[@]+"${allow_args[@]}"}" 2>/dev/null || true)
        if [ -n "$debt" ]; then
          echo "::error::Debt markers found in source:"
          printf '%s\n' "$debt"
          fail=1
        else
          echo "  none."
        fi

        # --- Proof circumventions, proof languages only -------------------
        echo "Scanning proof code for undeclared circumventions..."
        circ=$(git grep -n -E -w 'sorry|believe_me|admit|postulate|assert_total' -- \
                 '*.idr' '*.lean' '*.v' '*.agda' '*.thy' \
                 "${allow_args[@]+"${allow_args[@]}"}" 2>/dev/null || true)
        # Idris doc comments (|||) and line comments (--) describe axioms as
        # often as they declare them; only real code counts.
        circ=$(printf '%s\n' "$circ" | grep -vE ':[0-9]+:[[:space:]]*(\|\|\||--|//|\(\*)' || true)
        if [ -n "$circ" ]; then
          echo "::error::Undeclared proof circumventions found:"
          printf '%s\n' "$circ"
          echo "::error::If these are sanctioned axioms, isolate them in one module,"
          echo "::error::list that module in $ALLOW_FILE, and gate the count with a"
          echo "::error::trusted-base check (e.g. scripts/check-trusted-base.sh with"
          echo "::error::an EXPECTED_AXIOMS constant). An allowlist without a counter"
          echo "::error::is not a sanction, it is a silence."
          fail=1
        else
          echo "  none."
        fi

        if [ "$fail" -eq 1 ]; then
          echo "::error::Code hygiene gate failed."
          exit 1
        fi
        echo "Hygiene check passed."
