name: 'Recipes Set Validation Gate'
description: 'Validates that the recipes set (e.g. Justfile, Makefile) is extensive, working, and justifiable.'
runs:
  using: 'composite'
  steps:
    - name: Run Recipes Set Check
      shell: bash
      run: |
        echo "Validating Recipes Set..."
        # Syntactic checks (is it working?)
        if [ -f "Justfile" ]; then
          echo "Checking Justfile syntax..."
          # just --fmt --check || just --dry-run
        fi
        if [ -f "Makefile" ]; then
          echo "Checking Makefile syntax..."
          # make --dry-run
        fi
        
        # Semantic checks (extensive and justifiable)
        echo "Delegating extensiveness and justifiability check to Semantic Audit..."
        # cicd-squabbler audit --recipes
        
        echo "Recipes Set Validation Passed."
