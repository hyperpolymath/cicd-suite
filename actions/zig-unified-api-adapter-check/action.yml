name: 'Zig UnifiedApiAdapter Check'
description: 'Checks that Zig FFI implementations adhere to the unified-api-adapter and are pure.'
inputs:
  paths:
    description: 'Newline-separated tracked FFI source directories/files, including their local import closure. Empty retains the repository-wide Zig scan.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Run Zig UnifiedApiAdapter Check
      shell: bash
      env:
        FFI_PATHS: ${{ inputs.paths }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"

