# SPDX-License-Identifier: MPL-2.0
name: 'Contractile Validation Gate'
description: >-
  Validates contractile declarations (<Verb>file.deed; a2ml is retired,
  standards #837) by actually invoking deed-lint on each one. If a
  declaration is present but deed-lint is not on PATH the gate reports
  status=not_run and exits 2 (NO CHECK WAS PERFORMED); with no
  declarations it reports not_applicable. It never prints a pass for a
  runner that did not run. Not run by main-estate-audit, which installs
  no deed-lint.
inputs:
  path:
    description: 'Directory to scan for contractile declarations'
    required: false
    default: '.'
outputs:
  status:
    description: 'passed | failed | not_run | not_applicable'
    value: ${{ steps.contractile.outputs.status }}
runs:
  using: 'composite'
  steps:
    - name: Run Contractile Validation
      id: contractile
      shell: bash
      env:
        CONTRACTILE_WORKDIR: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
