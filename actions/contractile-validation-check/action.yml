# SPDX-License-Identifier: MPL-2.0
name: 'Contractile Validation Gate'
description: >-
  Validates contractile declarations (<Verb>file.deed; a2ml is retired,
  standards #837) with the estate DEED validator — the same
  deed-ecosystem validate-action manifest-check pins. With no
  declarations it reports not_applicable; it never prints a pass for a
  validation that did not run (there is no deed-lint CLI; an earlier
  version required one invented from a placeholder comment). Not run
  by main-estate-audit: manifest-check already runs this validator
  estate-wide.
inputs:
  path:
    description: 'Directory to scan for contractile declarations'
    required: false
    default: '.'
outputs:
  status:
    description: 'passed | failed | not_applicable | not_run'
    value: ${{ steps.verdict.outputs.status || steps.detect.outputs.status }}
runs:
  using: 'composite'
  steps:
    - name: Detect Contractile Declarations
      id: detect
      shell: bash
      env:
        CONTRACTILE_WORKDIR: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
    - name: Validate DEED Declarations
      id: validate
      if: ${{ steps.detect.outputs.has_declarations == 'true' }}
      uses: hyperpolymath/deed-ecosystem/validate-action@f9d999b60cb5f383679ea19912bcdc49c944973a # main @ 2026-09-17 — same pin as manifest-check
      with:
        path: ${{ steps.detect.outputs.validate_path }}
    # always(): a rejected declaration must still produce a verdict —
    # status=failed from the validator outcome, never the detector's
    # internal `detected` leaking into the advertised output contract.
    - name: Contractile Verdict
      id: verdict
      if: ${{ always() && steps.detect.outputs.has_declarations == 'true' }}
      shell: bash
      env:
        VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
      run: |
        if [ "$VALIDATE_OUTCOME" = "success" ]; then
          echo "status=passed" >> "$GITHUB_OUTPUT"
          echo "Contractile validation passed (the DEED validator ran on the detected declarations and exited 0)."
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "::error::Contractile validation failed: the DEED validator outcome was '$VALIDATE_OUTCOME' (see its step above)."
        fi
