name: 'Affirmation Document Gate'
description: 'Validates an applicable AFFIRMATION snapshot without treating it as a universal or self-proving document.'
inputs:
  required:
    description: 'Set true only when the repository declares the governance-tier capability.'
    required: false
    default: 'false'
  trusted-gpg-keys:
    description: 'Optional armoured PGP public-key file whose signatures count as trusted, in addition to the vendored GitHub web-flow key.'
    required: false
    default: ''
  allowed-signers:
    description: 'Optional git allowed_signers file for SSH-signed commits. Defaults to .github/allowed_signers when present.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Run Affirmation Check
      shell: bash
      env:
        AFFIRMATION_REQUIRED: ${{ inputs.required }}
        AFFIRMATION_TRUSTED_GPG_KEYS: ${{ inputs.trusted-gpg-keys }}
        AFFIRMATION_ALLOWED_SIGNERS: ${{ inputs.allowed-signers }}
      run: "${{ github.action_path }}/check.sh"
