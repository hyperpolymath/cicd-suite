# SPDX-License-Identifier: MPL-2.0
name: 'Panic Attack & Pons Gate'
description: >-
  Runs `pons verify .` and `panic-attack scan .` — for real. If either
  binary is not on PATH the gate reports status=not_run and exits 2
  (NO CHECK WAS PERFORMED); it never prints a pass for a scan that did
  not run. Install both tools before this step. Not run by
  main-estate-audit: panic-attack/pons evidence comes from the
  standards Hypatia lane's envelopes.
inputs:
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
outputs:
  status:
    description: 'passed | failed | not_run'
    value: ${{ steps.custom-tools.outputs.status }}
runs:
  using: 'composite'
  steps:
    - name: Run Custom Tools Check
      id: custom-tools
      shell: bash
      env:
        CUSTOM_TOOLS_WORKDIR: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
