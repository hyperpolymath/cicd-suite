# SPDX-License-Identifier: MPL-2.0
name: 'Panic Attack & Pons Gate'
description: >-
  Runs both scanners with strict coverage. Pons gates warn/error findings;
  panic-attack assail findings remain report-only. Missing tools, incomplete
  coverage and execution failures cannot pass. Install both tools first.
  This is not an end-to-end proof or a clean-security certificate.
inputs:
  path:
    description: 'Directory to scan'
    required: false
    default: '.'
outputs:
  status:
    description: 'passed | failed | not_run'
    value: ${{ steps.custom-tools.outputs.status }}
runs:
  using: 'composite'
  steps:
    - name: Run Custom Tools Check
      id: custom-tools
      shell: bash
      env:
        CUSTOM_TOOLS_WORKDIR: ${{ inputs.path }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
