# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0

name: Central Estate CI/CD Audit

# The estate audit, as FIVE component checks instead of one job of 26 steps.
#
# Why components. One job stopped at its first failing gate, so a single red
# gate hid the other 25 and every failure read "estate-audit: failing after
# 8s" with no gate named. Now each component is its own check run, and inside
# a component every gate runs even after an earlier one fails (the
# `!cancelled()` guard), so one push reports every failing gate at once.
#
#   governance  required-files, spdx-license, affirmation, referencing
#   hygiene     code-hygiene, formatting, linguist, secrets, vaulted-tokens
#   manifests   manifest, recipes-set
#   languages   idris2-abi, zig-unified-api-adapter, proof-runner, boj-cartridge
#   advisory    nine gates that cannot fail BY DESIGN (README: "What actually
#               enforces"); a green tick here is information, not assurance.
#
# Removed: prat and semantic-audit. They were stubs (README, Known defect 5):
# semantic-audit printed "Semantic Audit Passed." unconditionally and prat
# passed any repo with a tests/ directory, so a green tick credited assurance
# that nothing checked. Their directories stay under actions/ only so that
# not-yet-migrated copies of the old 26-step workflow still start; delete them
# once every consumer calls this reusable workflow.
#
# Consumers call this workflow; they do not copy it (see README, "Consuming
# it"). The caller pins this file at a full SHA and is de-onboarded from its
# own actions.lock, the form proven for callers with sha_pinning_required.
#
# Refs (empirical cross-repo matrix, all witnessed 2026-09-17, runs
# 35277504987 / 35277227942 / 35278067796 / 35279718644 / 35280642055 /
# 35280317253):
#   $/actions/*            -> resolves at the CALLER's commit cross-repo: 0-job.
#   ./actions/* + lock     -> "local path actions not supported": 0-job.
#   ./actions/* de-onboard -> ./ resolves against the CALLER: no action.yml.
#   remote @main/tag + lock (onboarded) -> 0-job startup_failure cross-repo.
#   remote @SHA + de-onboarded -> works (35279718644), deed/k9@SHA fetched.
# So every gate is a remote ref at a FULL SHA and this workflow is
# de-onboarded from actions.lock. The bare-by-SHA checkout fetches the CALLING
# repo, so the gates audit the caller's tree, which is the design intent.
# Gate IMPLEMENTATIONS are pinned to the SHA below: repin when actions/**
# changes (tests/lock-transitive-closure.sh fails until you do).

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      # Forwarded to manifest-check. For files that carry a manifest extension
      # but are not manifests (panic-attack's suppression registry at
      # audits/assail-classifications.a2ml, for one). A value REPLACES that
      # validator's default ignore list; empty keeps the defaults. On this
      # repository's own push and pull_request runs both are empty.
      manifest-deed-paths-ignore:
        description: 'Newline-separated path fragments the DEED validator skips (replaces its defaults; empty keeps them).'
        type: string
        required: false
        default: ''
      manifest-k9-paths-ignore:
        description: 'Newline-separated path fragments the K9 validator skips (replaces its defaults; empty keeps them).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required Files Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/required-files-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: SPDX License Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/spdx-license-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Affirmation Document Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/affirmation-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Academic Referencing Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/referencing-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Code Hygiene Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/code-hygiene-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Formatting Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/formatting-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Linguist & Banned Languages Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/linguist-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Are We UnAPI Gate (Secret Scanning)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/secrets-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Reasonably Good Token Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/vaulted-tokens-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)

  manifests:
    name: manifests
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifest Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/manifest-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
        with:
          deed-paths-ignore: ${{ inputs.manifest-deed-paths-ignore }}
          k9-paths-ignore: ${{ inputs.manifest-k9-paths-ignore }}
      - name: Recipes Set Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/recipes-set-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)

  languages:
    name: languages
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Idris2 ABI Purity Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/idris2-abi-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Zig UnifiedApiAdapter API Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/zig-unified-api-adapter-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Proof Runner Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/proof-runner-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: BoJ Cartridge Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/boj-cartridge-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)

  advisory:
    name: advisory
    runs-on: ubuntu-24.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Contractile Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/contractile-validation-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Panic Attack & Pons Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/custom-tools-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: WWW & Well-Known Compliance Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/www-compliance-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Accreditations & Badges Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/badges-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Metrics Extraction Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/metrics-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Test & Benchmarks Dashboard Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/tests-benches-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Hosting & Site Status Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/hosting-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Git-Sea Analytics Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/gitsea-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
      - name: Trust & Humans Validation Gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: hyperpolymath/cicd-suite/actions/trust-humans-check@9a947faad4f7f6640148980dd892b39f216fd091 # 2026-10-14 (#54)
