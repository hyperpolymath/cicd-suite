#
# creusot-gate.yml — Rust deductive verification (Creusot), as a reusable
# workflow. The Rust twin of spark-gate.yml, and the "reusable verifier gate
# with a planted failing contract" that hyperpolymath/standards#692 asks for.
#
#   detect   facts about the tree (obligations? claims? which crates?)
#   theatre  a "verified with Creusot" claim with no contracts behind it is
#            a hard failure (T1); a creusot-std dependency that annotates
#            nothing is named (T2, warning unless enforce_hollow); every
#            #[trusted] axiom is listed (T3, the proof's residue)
#   prove    installs Creusot at a PINNED release (opam switch cached), proves
#            a planted FALSE contract and REQUIRES the prover to refuse it,
#            proves a planted TRUE one and requires success, and only then
#            runs `cargo creusot` in every crate with obligations
#   verdict  one context to require; a skipped prove with obligations present
#            is VOID, not green
#
# Creusot + nightly pairing: Creusot is built against one specific nightly
# (its rust-toolchain file). v0.14.0 (2026-10-12) pairs with
# nightly-2026-08-03. Move both inputs together; the install step installs
# the clone's own pin regardless, so a mismatch costs time, not soundness.
#
# Gate scripts are pinned at the caller's own `uses:` SHA — see rust-ci.yml.

name: Creusot Gate (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: ubuntu-24.04
      working_directory:
        description: Tree root to scan (Cargo manifests are found beneath it)
        type: string
        required: false
        default: "."
      creusot_version:
        description: Creusot release tag to install (without the leading v)
        type: string
        required: false
        default: "0.14.0"
      rust_nightly:
        description: The nightly Creusot is built against (must match the release)
        type: string
        required: false
        default: "nightly-2026-08-03"
      enforce_hollow:
        description: Fail (not warn) when creusot-std is a dependency but no contract exists
        type: boolean
        required: false
        default: false
      prove_args:
        description: 'Scope-preserving options only: --no-cache, --why3session, -j N (positive decimal)'
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Every `run:` step gets bash with -e AND pipefail. GitHub's default when no
# shell is named is `bash -e` without pipefail, which would let a failing
# gate script hide behind the `| tee` that records its facts.
defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect Creusot obligations
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      suite_sha: ${{ steps.suite.outputs.sha }}
      obligations: ${{ steps.facts.outputs.obligations }}
      claims: ${{ steps.facts.outputs.claims }}
      creusot_version: ${{ steps.facts.outputs.creusot_version }}
      contract_count: ${{ steps.facts.outputs.contract_count }}
      trusted_count: ${{ steps.facts.outputs.trusted_count }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: creusot-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Facts
        id: facts
        env:
          CREUSOT_GATE_PHASE: detect
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: bash .cicd-suite/actions/creusot-check/check.sh | tee -a "$GITHUB_OUTPUT"

  theatre:
    name: Creusot theatre gate
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    needs: detect
    permissions:
      contents: read
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: creusot-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Claims must be backed by contracts
        env:
          CREUSOT_GATE_PHASE: theatre
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          ENFORCE_HOLLOW: ${{ inputs.enforce_hollow }}
        run: bash .cicd-suite/actions/creusot-check/check.sh

  prove:
    name: Creusot proofs (cargo creusot prove)
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    needs: [detect, theatre]
    if: ${{ needs.detect.outputs.obligations == 'true' }}
    permissions:
      contents: read
    env:
      CREUSOT_VERSION: ${{ inputs.creusot_version }}
    outputs:
      proof_step_outcome: ${{ steps.proof.outcome }}
      execution_stage: ${{ steps.proof.outputs.execution_stage }}
      execution_outcome: ${{ steps.proof.outputs.execution_outcome }}
      controls_passed: ${{ steps.proof.outputs.controls_passed }}
      proof_started: ${{ steps.proof.outputs.proof_started }}
      proof_completed: ${{ steps.proof.outputs.proof_completed }}
      crates_expected: ${{ steps.proof.outputs.crates_expected }}
      crates_attempted: ${{ steps.proof.outputs.crates_attempted }}
      crates_completed: ${{ steps.proof.outputs.crates_completed }}
      source_revision: ${{ steps.proof.outputs.source_revision }}
      suite_revision: ${{ steps.proof.outputs.suite_revision }}
      proof_exit_code: ${{ steps.proof.outputs.proof_exit_code }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the suite repository and commit this caller pins
        id: suite
        env:
          SUITE_WORKFLOW: creusot-gate.yml
        # Inside a reusable workflow the `github` context is the CALLER's, so
        # GITHUB_WORKFLOW_REF names the caller's workflow file — which is in
        # the tree just checked out and holds the very `uses:` line GitHub
        # resolved to reach this file. That SHA pins the gate scripts: one
        # pin, held by the caller, selects both the workflow and its scripts.
        # (`github.job_workflow_sha` is an OIDC claim, not a context property,
        # and reading the token would need id-token: write from every caller.)
        run: |
          set -euo pipefail
          command -v yq >/dev/null || { echo '::error::yq is unavailable; source pin NOT VERIFIED'; exit 2; }
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/"* ]] || exit 2
          path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"; path="${path%@*}"
          case "$path" in .github/workflows/*.yml|.github/workflows/*.yaml) ;; *) exit 2 ;; esac
          [[ "${path#.github/workflows/}" != */* && -f "$path" && ! -L "$path" ]] \
            || { echo '::error::caller workflow is absent or is not a direct workflow file; source pin NOT VERIFIED'; exit 2; }
          candidates=$(yq -r '.jobs[] | select(has("uses")) | .uses' "$path") \
            || { echo '::error::caller workflow cannot be parsed; source pin NOT VERIFIED'; exit 2; }
          refs=''
          while IFS= read -r ref; do
            # Other reusable workflows do not select this gate's source.
            [[ "$ref" == */.github/workflows/"$SUITE_WORKFLOW"* ]] || continue
            case "$ref" in
              hyperpolymath/cicd-suite/.github/workflows/"$SUITE_WORKFLOW"@*|hyperpolymath/proven-cicd/.github/workflows/"$SUITE_WORKFLOW"@*)
                repository=${ref%%/.github/workflows/*}
                sha=${ref##*@}
                [[ "$sha" =~ ^[0-9a-f]{40}$ && "$ref" == "$repository/.github/workflows/$SUITE_WORKFLOW@$sha" ]] \
                  || { echo '::error::suite caller must pin one complete 40-hex SHA; source pin NOT VERIFIED'; exit 2; }
                refs+="$repository@$sha"$'\n'
                ;;
              *) echo '::error::unexpected suite source reference; source pin NOT VERIFIED'; exit 2 ;;
            esac
          done <<< "$candidates"
          refs=$(printf '%s' "$refs" | sort -u)
          n=$(printf '%s' "$refs" | grep -c . || true)
          [[ "$n" -eq 1 ]] \
            || { echo "::error::$path selects $n distinct suite repository/commit pairs; exactly one is required. NO CHECK WAS PERFORMED."; exit 2; }
          repository=${refs%@*}
          sha=${refs##*@}
          printf 'repository=%s\nsha=%s\n' "$repository" "$sha" >> "$GITHUB_OUTPUT"
          echo "Suite source pinned at $repository@$sha by $path"
      - name: Check out the selected suite at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.suite.outputs.repository }}
          ref: ${{ steps.suite.outputs.sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse gate scripts from an unverified cicd-suite commit
        env:
          EXPECTED: ${{ steps.suite.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ steps.suite.outputs.repository }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Install the nightly Creusot ${{ inputs.creusot_version }} is built against
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-08-04 (v1)
        with:
          toolchain: ${{ inputs.rust_nightly }}
          components: rustfmt, rustc-dev, llvm-tools
      - name: Install opam and Creusot's system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          # Creusot v0.14.0's ./INSTALL resolves Why3 IDE through opam; opam
          # cannot install these apt dependencies noninteractively. Without
          # them, switch creation exits before any proof is attempted.
          sudo apt-get install -y --no-install-recommends \
            opam libzmq3-dev libgmp-dev pkg-config autoconf \
            libcairo2-dev libgtk-3-dev libgtksourceview-3.0-dev
      - name: Cache the Creusot opam switch, provers and cargo-creusot
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/creusot
            ~/.cargo/bin/cargo-creusot
            ~/.cargo/bin/creusot-rustc
            ~/.config/creusot
          key: creusot-${{ inputs.creusot_version }}-${{ inputs.rust_nightly }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install Creusot v${{ inputs.creusot_version }} (clone at the tag, ./INSTALL)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          opam init --bare -y --disable-sandboxing
          git clone --depth 1 --branch "v${CREUSOT_VERSION}" https://github.com/creusot-rs/creusot "$RUNNER_TEMP/creusot"
          cd "$RUNNER_TEMP/creusot"
          ./INSTALL
      - name: cargo creusot is on PATH
        run: |
          set -euo pipefail
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo creusot --help >/dev/null
          cargo creusot version
      - name: Planted controls, then every crate with obligations
        id: proof
        env:
          CREUSOT_GATE_PHASE: prove
          CREUSOT_SUITE_REVISION: ${{ steps.suite.outputs.sha }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          PROVE_ARGS: ${{ inputs.prove_args }}
        run: bash .cicd-suite/actions/creusot-check/check.sh

  verdict:
    name: Creusot verdict
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 5
    needs: [detect, theatre, prove]
    if: ${{ always() }}
    permissions:
      contents: read
    env:
      OBLIGATIONS: ${{ needs.detect.outputs.obligations }}
      CLAIMS: ${{ needs.detect.outputs.claims }}
      TRUSTED: ${{ needs.detect.outputs.trusted_count }}
      R_DETECT: ${{ needs.detect.result }}
      R_THEATRE: ${{ needs.theatre.result }}
      R_PROVE: ${{ needs.prove.result }}
      PROOF_STEP_OUTCOME: ${{ needs.prove.outputs.proof_step_outcome }}
      EXECUTION_STAGE: ${{ needs.prove.outputs.execution_stage }}
      EXECUTION_OUTCOME: ${{ needs.prove.outputs.execution_outcome }}
      CONTROLS_PASSED: ${{ needs.prove.outputs.controls_passed }}
      PROOF_STARTED: ${{ needs.prove.outputs.proof_started }}
      PROOF_COMPLETED: ${{ needs.prove.outputs.proof_completed }}
      CRATES_EXPECTED: ${{ needs.prove.outputs.crates_expected }}
      CRATES_ATTEMPTED: ${{ needs.prove.outputs.crates_attempted }}
      CRATES_COMPLETED: ${{ needs.prove.outputs.crates_completed }}
      SOURCE_REVISION: ${{ needs.prove.outputs.source_revision }}
      SUITE_REVISION: ${{ needs.prove.outputs.suite_revision }}
      PROOF_EXIT_CODE: ${{ needs.prove.outputs.proof_exit_code }}
      EXPECTED_SOURCE_REVISION: ${{ github.sha }}
      EXPECTED_SUITE_REVISION: ${{ needs.detect.outputs.suite_sha }}
    steps:
      - name: Require a resolved gate before reading its execution evidence
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SUITE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Creusot execution: PreflightFailed — the gate source was not resolved; no proof verdict is available."
            exit 2
          fi
      - name: Check out the resolved verdict implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/cicd-suite
          ref: ${{ needs.detect.outputs.suite_sha }}
          path: .cicd-suite
          persist-credentials: false
      - name: Refuse an unverified verdict implementation
        env:
          EXPECTED: ${{ needs.detect.outputs.suite_sha }}
        run: bash .cicd-suite/scripts/verify-suite-checkout.sh
      - name: Adjudicate
        run: bash .cicd-suite/actions/creusot-check/verdict.sh
