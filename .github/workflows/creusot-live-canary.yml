# SPDX-License-Identifier: MPL-2.0
# Stage two after PR70: real tool, narrowly scoped fixture, published gate source.
name: Creusot live canary
on:
  pull_request:
    paths:
      - '.github/workflows/creusot-live-canary.yml'
      - 'tests/fixtures/creusot-live/**'
      - 'tests/creusot-live-canary.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: creusot-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixture:
    name: Locked fixture and published source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse an unpublished gate pin
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6c6d772ebe82605ba22254db528faf54faec9f49 origin/main
      - name: Recover the complete Cargo lock (bootstrap only, not proof)
        shell: bash
        run: |
          set -euo pipefail
          lock=tests/fixtures/creusot-live/Cargo.lock
          rm "$lock"
          cargo generate-lockfile --manifest-path tests/fixtures/creusot-live/Cargo.toml
          # Bounded chunks avoid annotation truncation. Identity checks detect loss.
          i=0
          while IFS= read -r chunk; do
            printf '::notice title=fixture-lock-%03d::%s\n' "$i" "$chunk"
            i=$((i + 1))
          done < <(base64 -w1800 "$lock")
          printf '::notice title=fixture-lock-identity::%s %s\n' "$(wc -c < "$lock")" "$(sha256sum "$lock" | cut -d' ' -f1)"
      - name: Fixture prerequisites and missing-prerequisite mutants (not proof)
        shell: bash
        run: |
          set -euo pipefail
          cargo --version
          bash tests/creusot-live-canary.sh
          sha256sum tests/fixtures/creusot-live/Cargo.lock
          git diff --exit-code -- tests/fixtures/creusot-live
  creusot:
    needs: fixture
    uses: hyperpolymath/cicd-suite/.github/workflows/creusot-gate.yml@6c6d772ebe82605ba22254db528faf54faec9f49 # published PR70 repair
    with:
      working_directory: tests/fixtures/creusot-live
      creusot_version: '0.14.0'
      rust_nightly: nightly-2026-08-03
      enforce_hollow: true
