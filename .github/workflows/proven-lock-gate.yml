# proven-cicd: proven-lock-gate@0.1.0 sha256:c185121117c95de439cf060b510b0117aef2b11ed33927269a27aab58ac04466
# SPDX-License-Identifier: MPL-2.0
# Stamped copy of hyperpolymath/proven-cicd-and-workflows templates/proven-lock-gate.yml.
# Do not edit by hand. A changed body fails this gate as drift. The applier
# moves the pinned suite SHA. The line after each `proven-cicd:local-next`
# marker is local and outside the stamp's hash.
#
# The gate judges this repository's actions.lock against its workflows with the
# proven lock kernel. It exits 0 for consistent, 1 for a defect or drift, and 2
# when it could not run. A run that could not run fails this job: it is never
# skipped and never continue-on-error, so a required check cannot pass without
# a verdict.
name: Proven lock gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  proven-lock:
    name: Proven lock gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # proven-cicd:local-next
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Judge actions.lock with the proven suite at its pinned commit
        env:
          # proven-cicd:local-next
          PROVEN_SHA: "e8e7db3e731217707acc0238986fb6db2ca4578a"
        run: |
          set -euo pipefail
          [[ $PROVEN_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "PROVEN_LOCK_CLASS=not_run:pin"; exit 2; }
          suite="$RUNNER_TEMP/proven-suite"
          git init -q "$suite"
          git -C "$suite" remote add origin https://github.com/hyperpolymath/proven-cicd-and-workflows.git
          git -C "$suite" config core.sparseCheckout true
          printf '%s\n' dist/ scripts/ tests/fixtures/proven-lock/ > "$suite/.git/info/sparse-checkout"
          fetched=0
          for delay in 0 10 30; do
            sleep "$delay"
            if git -C "$suite" fetch -q --depth=1 origin "$PROVEN_SHA"; then fetched=1; break; fi
          done
          [[ $fetched == 1 ]] || { echo "PROVEN_LOCK_CLASS=not_run:fetch"; exit 2; }
          git -C "$suite" checkout -q --detach FETCH_HEAD
          [[ $(git -C "$suite" rev-parse HEAD) == "$PROVEN_SHA" ]] || { echo "PROVEN_LOCK_CLASS=not_run:pin"; exit 2; }
          bash "$suite/scripts/proven-lock-gate.sh" "$GITHUB_WORKSPACE" .github/workflows/proven-lock-gate.yml
