# SPDX-License-Identifier: MPL-2.0
# Experimental, non-enforcing parallel lane: never replace existing gates on
# the strength of this job alone. Source pin is an immutable commit, not a tag.
name: Assurance kernel (Idris2 canary)

on:
  pull_request:
    paths:
      - "src/Assurance/**"
      - "assurance-kernel.ipkg"
      - "assurance-github.ipkg"
      - "scripts/assurance-github.*"
      - "tests/assurance-github.sh"
      - "tests/assurance-real-canaries.sh"
      - "config/assurance-canaries/**"
      - "tests/assurance-kernel.sh"
      - ".github/workflows/assurance-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# PR updates supersede previous costly compiler boots; manual dispatches are unique.
concurrency:
  group: assurance-kernel-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Compiler proofs and contradictory-proof control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify and record the exact subject revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'Assurance compiler subject: `%s`\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Chez Scheme and Idris2 build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends chezscheme libgmp-dev git make gcc ca-certificates jq gh
      - name: Validate bridge shell and qualifier syntax
        run: |
          set -euo pipefail
          for script in scripts/assurance-github.sh tests/assurance-github.sh tests/assurance-real-canaries.sh; do
            bash -n "$script"
          done
          jq -n -L scripts 'include "assurance-github"; true' >/dev/null
      - name: Bootstrap pinned Idris2 0.7.0 source
        env:
          IDRIS2_SOURCE_SHA: 27780073c8631826d846499840b3857d9b9a4fd5
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          git -C "$dir" init -q
          git -C "$dir" remote add origin https://github.com/idris-lang/Idris2.git
          git -C "$dir" fetch --depth=1 origin "$IDRIS2_SOURCE_SHA"
          git -C "$dir" checkout --detach -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$IDRIS2_SOURCE_SHA"
          make -C "$dir" bootstrap SCHEME=chezscheme
          make -C "$dir" install
          "$HOME/.idris2/bin/idris2" --version
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
      - name: Compile model and reject contradictory proof
        run: bash tests/assurance-kernel.sh
      - name: Compile and exercise the new finite GitHub bridge
        run: bash tests/assurance-github.sh
      - name: Observe passing and defective real consumers
        id: real_canaries
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: bash tests/assurance-real-canaries.sh "$RUNNER_TEMP/assurance-real-consumers"
      - name: Retain separate real consumer verdicts
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.real_canaries.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-real-consumers-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/assurance-real-consumers/
          if-no-files-found: error
          retention-days: 14
