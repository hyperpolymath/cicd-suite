# SPDX-License-Identifier: MPL-2.0
# Keep scan / gitleaks: required by the estate Secret-Scan-Floor ruleset.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Scheduled/full audits and PR cancellation do not cancel one another.
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    uses: hyperpolymath/cicd-suite/.github/workflows/secret-scanner-reusable.yml@d285b0a6f9bd85c7d678619dd6269437127dddb5
    with:
      # Keep false until an initial full audit passes and the security owner
      # accepts introduced-commit PR coverage. All non-PR runs remain full.
      fast-pr: false
