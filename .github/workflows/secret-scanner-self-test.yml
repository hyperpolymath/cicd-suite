# SPDX-License-Identifier: MPL-2.0
name: Bounded secret scanner controls
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: secret-controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell and YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in actions/secret-scan-check/*.sh; do bash -n "$f"; done
          yq '.' .github/workflows/secret-scanner-reusable.yml >/dev/null
          yq '.' templates/secret-scanner-caller.yml >/dev/null
          yq '.' actions/secret-scan-check/action.yml >/dev/null
      - name: Capability atlas inventory, navigation and negative controls
        run: |
          python3 scripts/build-capability-catalogue.py --check
          python3 tests/capability-catalogue.py
      - name: Governance pin representation regressions (not full lock verification)
        run: bash tests/lock-pin-contract.sh
      - name: Official SonarCloud receipt regressions
        run: |
          bash -n actions/sonarcloud-result-check/check.sh
          yq '.' actions/sonarcloud-result-check/action.yml >/dev/null
          bash actions/sonarcloud-result-check/test.sh
      - name: Shell/control-flow fixtures and vacuous-scanner mutant
        run: bash actions/secret-scan-check/test.sh
      - name: Compatibility contexts require real SHA-bound detector receipts
        run: bash tests/secret-scanner-receipts.sh
      - name: Preserve pinned legacy Rust and shell detection without leaking values
        run: bash tests/secret-scanner-supplements.sh
      - name: Install the pinned real scanner
        run: bash actions/secret-scan-check/install.sh "$RUNNER_TEMP/suite-gitleaks"
      - name: Repeat fixtures against the real detector (not a stand-in)
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/suite-gitleaks/gitleaks
        run: bash actions/secret-scan-check/test.sh
      - name: Production caller pin is already published on suite main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash tests/published-scanner-pin.sh
          ref=$(yq -r '.jobs.scan.uses' .github/workflows/secret-scanner.yml)
          bash scripts/verify-published-scanner-pin.sh "${ref##*@}"
      - name: Evidence collector controls
        run: bash tests/inspect-pr-ci.sh
