# Canary safety: retained for Rust/shell coverage comparison; not scan / gitleaks.
# SPDX-License-Identifier: MPL-2.0
# Prevention workflow - scans for hardcoded secrets before they reach main.
#
# Retained comparison bundle (gitleaks + rust-secrets + shell-secrets).
# This job deliberately uses `legacy`; only secret-scanner.yml owns the
# required scan / gitleaks context.
#
# No `secrets:` line, deliberately: the reusable references no secrets
# (gitleaks runs as a checksum-verified binary, not gitleaks-action), so
# `secrets: inherit` would only hand it every repo and org secret (CWE-250).
name: Legacy secret scanner (coverage comparison)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  legacy:
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@74d2f66f575246cf6e313ae7775f44df6e097ff2
