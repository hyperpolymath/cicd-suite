# SPDX-License-Identifier: MPL-2.0
# Filename retained from the comparison canary. No moved-owner reusable,
# duplicate full-history Gitleaks pass, secret inheritance or policy expansion.
# The source ports are compared with a frozen pinned oracle by differential CI.
name: Supplemental secret checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: supplemental-secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supplements:
    name: ${{ matrix.language }} supplemental secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        language: [rust, shell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan using the maintained in-suite port
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          case "$LANGUAGE" in rust|shell) ;; *) exit 2 ;; esac
          timeout --signal=TERM --kill-after=10s 90s bash "actions/secret-scan-check/$LANGUAGE-supplement.sh"
