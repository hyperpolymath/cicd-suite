# SPDX-License-Identifier: MPL-2.0
name: Track latest estate audit

# Weekly: is the cicd-suite estate audit this repository calls behind
# cicd-suite's main? If so, open a PR that moves the pin in
# main-estate-audit.yml to cicd-suite HEAD. The PR's own estate-audit run is
# the check: merge it when the five components are green. Nothing reaches
# main unreviewed.
#
# ⚠ NO `uses:` ANYWHERE, DELIBERATELY: actions.lock is keyed by workflow path,
# and this must run even when the lock is stale.
#
# Token: AUTOMATION_TOKEN, a fine-grained token on this repository with
# Contents, Pull requests and Workflows set to read/write. In practice it is
# required: the bump edits a file under .github/workflows/, which
# GITHUB_TOKEN may not write, and a PR opened by GITHUB_TOKEN does not trigger
# the estate-audit run that validates it.

on:
  schedule:
    - cron: "23 7 * * 1"   # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-estate-audit
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      BRANCH: ci/track-estate-audit
      CALLER: .github/workflows/main-estate-audit.yml
    steps:
      - name: Move the cicd-suite pin to HEAD and open a PR
        run: |
          set -euo pipefail
          gh auth setup-git
          base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)
          gh repo clone "$GITHUB_REPOSITORY" repo -- --quiet --depth 1 --branch "$base"
          cd repo

          pinned=$(grep -oE 'cicd-suite/\.github/workflows/main-estate-audit\.yml@[0-9a-f]{40}' "$CALLER" \
                     | sed 's/.*@//' | head -n 1 || true)
          if [ -z "$pinned" ]; then
            echo "::error::$CALLER does not call cicd-suite's reusable estate audit at a full SHA."
            exit 1
          fi
          head=$(git ls-remote https://github.com/hyperpolymath/cicd-suite.git HEAD | cut -f1)
          echo "pinned ${pinned:0:7}, cicd-suite HEAD ${head:0:7}"
          if [ "$pinned" = "$head" ]; then
            echo "Already at cicd-suite HEAD."
            exit 0
          fi

          sed -i "s/$pinned/$head/g" "$CALLER"
          git switch --quiet -c "$BRANCH"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898583+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -am "ci(estate-audit): track cicd-suite ${head:0:7}"
          if ! git push --quiet --force origin "$BRANCH"; then
            echo "::error::Push refused: writing under .github/workflows/ needs the AUTOMATION_TOKEN secret described above."
            exit 1
          fi
          body="Moves the estate audit to cicd-suite \`${head:0:7}\` (was \`${pinned:0:7}\`): https://github.com/hyperpolymath/cicd-suite/compare/$pinned...$head. This PR's estate-audit run is the check. Opened by \`track-estate-audit.yml\`."
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "ci(estate-audit): track cicd-suite ${head:0:7}" --body "$body"
          else
            gh pr create --base "$base" --head "$BRANCH" \
              --title "ci(estate-audit): track cicd-suite ${head:0:7}" --body "$body"
          fi
